name: align_app
description: Align relationship assessment app
publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  purchases_flutter: ^9.10.8
  shared_preferences: ^2.4.20
  fl_chart: ^1.1.1
  share_plus: ^12.0.1
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/Align-Logo.png
    - assets/images/Align-Logo-Splash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Align-Logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F0F7F6"
  adaptive_icon_foreground: "assets/images/Align-Logo.png"

flutter_native_splash:
  color: "#F0F7F6"
  image: assets/images/Align-Logo-Splash.png
  android: true
  ios: false
  fullscreen: false
  android_gravity: center
  android_12:
    image: assets/images/Align-Logo-Splash.png
    color: "#F0F7F6"